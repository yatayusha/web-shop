<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1>To Be Dressed</h1>
    <button id="cart-btn" class="cart-btn">
      Корзина (<span id="cart-count">0</span>)
    </button>
  </header>

  <main>
    <section id="catalog" class="catalog"></section>
  </main>

  <div id="cart-modal" class="modal" hidden>
    <div class="modal-content">
      <button id="close-cart" class="close-btn">×</button>
      <h2 class="cart-title">
        Корзина
      </h2>
      <ul id="cart-items" class="cart-items"></ul>
      <p class="cart-total">Итого:&nbsp; <span id="cart-total">0</span>&nbsp;рублей</p>
      <button id="checkout-btn" class="checkout-btn">
        Оформить заказ
      </button>
    </div>
  </div>

  <div id="order-modal" class="modal" hidden>
    <div class="modal-content">
      <button id="close-order" class="close-btn">×</button>
      <h2 class="order-title">Оформление заказа</h2>
      <form id="order-form">
        <label>Имя <input type="text" name="firstName" required></label>
        <label>Фамилия <input type="text" name="lastName" required></label>
        <label>Адрес доставки <input type="text" name="address" required></label>
        <label>Телефон <input type="tel" name="phone" required></label>
        <button type="submit" class="submit">
          Создать заказ
        </button>
      </form>
      <p id="order-success" hidden>Заказ создан!</p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
