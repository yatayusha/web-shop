<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Мой магазин</h1>
    <button id="cart-btn">Корзина (<span id="cart-count">0</span>)</button>
  </header>

  <main>
    <section id="catalog">
      
      <article class="product-card" data-id="1">
        <img src="https://via.placeholder.com/150" alt="Товар 1">
        <h2>Товар 1</h2>
        <p class="price">1000 ₽</p>
        <button class="add-to-cart">Добавить в корзину</button>
      </article>

      <!-- остальные карточки JS будет генерировать сам -->
    </section>

    <section id="cart" hidden>
      <h2>Корзина</h2>
      <ul id="cart-items"></ul>
      <p>Итого: <span id="cart-total">0</span> ₽</p>
      <button id="checkout-btn">Оформить заказ</button>
    </section>

    <!-- форма заказа, скрыта по умолчанию -->
    <form id="order-form" hidden>
      <h2>Оформление заказа</h2>
      <label>Имя <input type="text" name="firstName" required></label>
      <label>Фамилия <input type="text" name="lastName" required></label>
      <label>Адрес доставки <input type="text" name="address" required></label>
      <label>Телефон <input type="tel" name="phone" required></label>
      <button type="submit">Создать заказ</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Мой магазин</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
